<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta http-equiv="refresh" content="0;url=https://accounts.zenventora.in/signup?product=visual-editor">
  <title>Create your Visual Editor account | ZenVentora</title>
  <script>
    (function () {
      var target = new URL("https://accounts.zenventora.in/signup?product=visual-editor");
      var params = new URLSearchParams(window.location.search);
      ["edition", "plan", "coupon"].forEach(function (key) {
        if (params.has(key)) target.searchParams.set(key, params.get(key));
      });
      window.location.replace(target.toString());
    })();
  </script>
</head>
<body>
  <main style="font-family:Inter,Arial,sans-serif;max-width:520px;margin:12vh auto;padding:32px 24px;text-align:center;color:#17213b">
    <p style="font-size:12px;font-weight:700;letter-spacing:.14em;color:#64748b">ZENVENTORA</p>
    <h1 style="font-size:28px;margin:12px 0">Create your Visual Editor account</h1>
    <p style="color:#64748b;line-height:1.6">Your account is managed securely through ZenVentora Accounts.</p>
    <a href="https://accounts.zenventora.in/signup?product=visual-editor" style="display:inline-block;margin-top:18px;padding:13px 22px;border-radius:10px;background:#315efb;color:white;text-decoration:none;font-weight:600">Continue to sign up</a>
  </main>
</body>
</html>
